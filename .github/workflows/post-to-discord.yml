name: Post Soccer Summary to Discord

on:
  push:
    branches:
      - main
    paths:
      - output.json

jobs:
  post-to-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Post to Discord
        run: |
          DATE=$(jq -r '.date' output.json)
          SUMMARY=$(jq -r '.summary' output.json)
          HEADLINES=$(jq -r '.headlines | map("• " + .) | join("\n")' output.json)
          MESSAGE="**Soccer Daily Digest — ${DATE}**\n\n${SUMMARY}\n\n${HEADLINES}"

          curl -s -X POST \
            -H "Authorization: Bot ${{ secrets.DISCORD_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$MESSAGE" '{"content": $content}')" \
            "https://discord.com/api/v10/channels/${{ secrets.DISCORD_CHANNEL_ID }}/messages"
